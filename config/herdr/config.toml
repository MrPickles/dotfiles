# https://herdr.dev/docs/configuration/
onboarding = false

[theme]
# Follow Ghostty's ANSI palette instead of Herdr's built-in tokyo-night.
name = "terminal"

[ui]
# Create tabs immediately; rename later with prefix+shift+t.
prompt_new_tab_name = false

[ui.toast]
# OSC 9/777 to Ghostty. Herdr skips the active tab. Ghostty posts as itself,
# so Focus/DND must allow Ghostty; macOS Ghostty notification sound is
# separate from [ui.sound]. Ghostty also silences banners while its window
# is focused unless the OS alert style is Persistent.
delivery = "terminal"

[ui.sound]
enabled = false
