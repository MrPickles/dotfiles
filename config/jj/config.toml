[ui]
default-command = "log"
diff-formatter = ":git"
# https://jj-vcs.github.io/jj/latest/config/#processing-contents-to-be-paged
pager = ["sh", "-c", "if command -v delta >/dev/null 2>&1; then exec delta; else exec ${PAGER:-less -FRX}; fi"]

[working-copy]
# No EOL conversion. Similar to core.autocrlf = false.
eol-conversion = "none"
