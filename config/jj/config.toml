[aliases]
# Move the closest bookmark to the parent commit before pushing.
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
# Rebase the current stack onto trunk.
retrunk = ["rebase", "-d", "trunk()"]

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"
"fork_history(to, from)" = "fork_point(to | from)..@"

[template-aliases]
"format_timestamp(timestamp)" = "timestamp.ago()"

[ui]
default-command = "log"
diff-formatter = ":git"
# https://jj-vcs.github.io/jj/latest/config/#processing-contents-to-be-paged
pager = ["sh", "-c", "if command -v delta >/dev/null 2>&1; then exec delta; else exec ${PAGER:-less -FRX}; fi"]

[working-copy]
# No EOL conversion. Similar to core.autocrlf = false.
eol-conversion = "none"
